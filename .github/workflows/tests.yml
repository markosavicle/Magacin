name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # Pages use @vite, so the feature tests need the built manifest.
      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  erp-sync-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-sync-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Demo sync (dry run, then apply, then nothing left to do)
        run: |
          erp-sync run -c examples/pantheon-demo.toml -f examples/pantheon_zalihe.csv || test $? -eq 4
          erp-sync run -c examples/pantheon-demo.toml -f examples/pantheon_zalihe.csv --apply || test $? -eq 4
          erp-sync run -c examples/pantheon-demo.toml -f examples/pantheon_zalihe.csv | tee out.txt || true
          grep -q "0 products to update" out.txt
