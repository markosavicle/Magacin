[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-sync-engine"
version = "0.1.0"
description = "Sync stock and prices from ERP CSV/XML exports to WooCommerce or Magento 2, with dry-run by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
erp-sync = "erp_sync.cli:main"

[tool.setuptools.packages.find]
include = ["erp_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
